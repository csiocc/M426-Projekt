<article class="karte flex h-[80vh] min-h-[32rem] flex-col overflow-hidden">
  <header class="flex shrink-0 items-center gap-3 px-5 py-4">
    <span
      class="flex size-9 shrink-0 items-center justify-center rounded-lg"
      [class]="istPdf() ? 'bg-danger/12 text-danger' : 'bg-accent/12 text-accent'"
      aria-hidden="true"
    >
      <i class="pi" [class]="istPdf() ? 'pi-file-pdf' : 'pi-image'"></i>
    </span>
    <div class="min-w-0">
      <h2 class="font-semibold tracking-tight text-label">Original</h2>
      <p class="truncate text-sm text-label-2">{{ datei().name }}</p>
    </div>
  </header>

  <div class="min-h-0 flex-1 border-t border-separator bg-fill">
    @if (istPdf()) {
      <iframe [src]="url()" [title]="datei().name" class="size-full border-0"></iframe>
    } @else {
      <img [src]="url()" [alt]="datei().name" class="size-full object-contain p-6" />
    }
  </div>
</article>
