<article
  class="flex h-[85vh] flex-col overflow-hidden rounded-xl border border-surface-200 bg-surface-0 shadow-sm dark:border-surface-700 dark:bg-surface-900"
>
  <header
    class="flex shrink-0 items-center gap-3 border-b border-surface-200 px-4 py-3 dark:border-surface-700"
  >
    <i
      class="pi text-lg"
      [class]="istPdf() ? 'pi-file-pdf text-red-500' : 'pi-image text-primary'"
      aria-hidden="true"
    ></i>
    <div class="min-w-0">
      <h2 class="text-sm font-semibold text-surface-900 dark:text-surface-0">Original</h2>
      <p class="truncate text-xs text-surface-500">{{ datei().name }}</p>
    </div>
  </header>

  @if (istPdf()) {
    <iframe [src]="url()" [title]="datei().name" class="w-full flex-1 border-0"></iframe>
  } @else {
    <img
      [src]="url()"
      [alt]="datei().name"
      class="min-h-0 w-full flex-1 bg-surface-50 object-contain p-4 dark:bg-surface-950"
    />
  }
</article>
