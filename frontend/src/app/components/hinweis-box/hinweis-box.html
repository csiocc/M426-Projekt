<div class="overflow-hidden rounded-xl text-sm" [class]="darstellung().farben">
  <button
    type="button"
    class="flex w-full cursor-pointer items-center gap-2 px-3.5 py-2.5 text-left font-medium"
    [attr.aria-expanded]="offen()"
    (click)="umschalten()"
  >
    <i class="pi text-xs" [class]="darstellung().icon" aria-hidden="true"></i>
    <span class="flex-1">{{ titel() }}</span>
    <i
      class="pi pi-chevron-down text-xs transition-transform duration-200"
      [class.rotate-180]="offen()"
      aria-hidden="true"
    ></i>
  </button>
  @if (offen()) {
    <!-- In der Hoehe begrenzt: lange Listen scrollen in sich. -->
    <div class="max-h-32 overflow-y-auto px-3.5 pb-3">
      <ng-content />
    </div>
  }
</div>
